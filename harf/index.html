<script>
  // Set theme + js class before paint to avoid a flash of the wrong theme
  (function () {
    var r = document.documentElement;
    r.classList.add('js');
    try {
      var t = localStorage.getItem('harf-theme');
      if (t === 'dark' || t === 'light') r.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

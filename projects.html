<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاريعي | Projects — ريماس سعد</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<header>
  <div class="logo" data-ar="ريماس سعد" data-en="Rimas Saad">ريماس سعد</div>
  <nav>
    <ul>
      <li><a href="index.html#about" data-ar="نبذة عني" data-en="About">نبذة عني</a></li>
      <li><a href="projects.html" data-ar="مشاريعي" data-en="Projects">مشاريعي</a></li>
      <li><a href="index.html#contact" data-ar="تواصل معي" data-en="Contact">تواصل معي</a></li>
      <li><button id="lang-toggle" data-ar="EN" data-en="عربي">EN</button></li>
    </ul>
  </nav>
</header>

<section class="hero">
  <h1 data-ar="مشاريعي" data-en="Projects">مشاريعي</h1>
  <p class="desc" data-ar="مجموعة من الأعمال التي بنيتها وأنا أتعلّم." data-en="A collection of work I've built while learning.">مجموعة من الأعمال التي بنيتها وأنا أتعلّم.</p>
</section>

<div class="projects-wrap">
  <span class="project-label" data-ar="٠١ — قريبًا" data-en="01 — Coming soon">٠١ — قريبًا</span>
  <div class="project-card">SOON</div>

  <span class="project-label" data-ar="٠٢ — قريبًا" data-en="02 — Coming soon">٠٢ — قريبًا</span>
  <div class="project-card">SOON</div>
</div>

<script>
const toggleBtn = document.getElementById('lang-toggle');
const htmlRoot = document.getElementById('html-root');
document.querySelector('.hero').classList.add('visible');

document.querySelectorAll('.project-card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
    card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  });
});

toggleBtn.addEventListener('click', () => {
  const isArabic = htmlRoot.lang === 'ar';
  htmlRoot.lang = isArabic ? 'en' : 'ar';
  htmlRoot.dir = isArabic ? 'ltr' : 'rtl';

  document.querySelectorAll('[data-ar]').forEach(el => {
    el.textContent = isArabic ? el.getAttribute('data-en') : el.getAttribute('data-ar');
  });
});
</script>

</body>
</html>
